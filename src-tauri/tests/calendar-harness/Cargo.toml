[package]
name = "bcorn-calendar-native-tests"
version = "0.0.0"
edition = "2021"
publish = false
[lib]
path = "lib.rs"
[dependencies]
serde = {version="1",features=["derive"]}
serde_json="1"
base64="0.22"
rand="0.8"
reqwest={version="0.12",default-features=false,features=["json","native-tls"]}
sha2="0.10"
subtle="2.6"
tokio={version="1",features=["rt","sync","time","macros"]}
url="2"
zeroize={version="1",features=["derive"]}
[target.'cfg(windows)'.dependencies]
windows-sys={version="0.61",features=["Win32_Foundation","Win32_Security_Cryptography","Win32_Storage_FileSystem"]}
