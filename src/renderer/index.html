<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ACORN</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="titlebar">
    <div class="brand">
      <span class="brand-mark">ACORN</span>
      <span class="date" id="date"></span>
    </div>
    <div class="actions">
      <button class="icon-btn" id="btn-refresh" data-action="refresh" title="刷新" aria-label="刷新">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9"/><path d="M13.5 2.5v3h-3"/></svg>
      </button>
      <button class="icon-btn" id="btn-pin" data-action="pin" title="置顶" aria-label="置顶" aria-pressed="false">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9.8 2.2l4 4-2.3.8-2.4 2.4.3 3-1.1 1.1L5.5 10.5 2.4 13.6M5.5 10.5L2.4 7.4l1.1-1.1 3 .3 2.4-2.4z"/></svg>
      </button>
      <button class="icon-btn" data-action="menu" title="更多" aria-label="更多">
        <svg viewBox="0 0 16 16" fill="currentColor"><circle cx="3.5" cy="8" r="1.3"/><circle cx="8" cy="8" r="1.3"/><circle cx="12.5" cy="8" r="1.3"/></svg>
      </button>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="today">今天</button>
    <button role="tab" data-tab="term">课表</button>
    <button role="tab" data-tab="grades">成绩</button>
  </nav>

  <main id="view"></main>
  <footer id="footer"></footer>

  <script src="app.js"></script>
</body>
</html>
