<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' ipc: http://ipc.localhost">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>bcorn</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="grades.css">
  <link rel="stylesheet" href="sheet-mapping.css">
  <link rel="stylesheet" href="cloud-calendar.css">
</head>
<body>
  <header class="titlebar">
    <div class="brand" hidden><span class="brand-mark">bcorn</span><span id="date"></span><span id="timezone"></span></div>
    <div id="header-calendar"></div>
    <div class="actions">
      <button class="icon-btn" id="btn-add" data-action="add-menu" title="新建" aria-label="新建课程或日程"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg></button>
      <button hidden class="icon-btn" id="btn-refresh" data-action="refresh" title="刷新" aria-label="刷新">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9"/><path d="M13.5 2.5v3h-3"/></svg>
      </button>
      <button hidden class="icon-btn" id="btn-pin" data-action="pin" title="置顶" aria-label="置顶" aria-pressed="false">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9.8 2.2l4 4-2.3.8-2.4 2.4.3 3-1.1 1.1L5.5 10.5 2.4 13.6M5.5 10.5L2.4 7.4l1.1-1.1 3 .3 2.4-2.4z"/></svg>
      </button>
      <button class="icon-btn" data-action="menu" title="更多" aria-label="更多">
        <svg viewBox="0 0 16 16" fill="currentColor"><circle cx="3.5" cy="8" r="1.3"/><circle cx="8" cy="8" r="1.3"/><circle cx="12.5" cy="8" r="1.3"/></svg>
      </button>
    </div>
  </header>

  <div class="calendar-toolbar"><nav class="tabs" role="tablist" aria-label="视图">
    <button role="tab" data-tab="today">日</button>
    <button role="tab" data-tab="term">周</button>
    <button role="tab" data-tab="grades">成绩</button>
  </nav><div id="term-control"></div><button class="today-btn" data-action="go-today">今天</button></div>

  <main id="view"></main>
  <footer id="footer"></footer>

  <dialog id="app-dialog" aria-labelledby="dialog-title"><div id="dialog-content"></div></dialog>
  <dialog id="discard-dialog" aria-labelledby="discard-title"><div class="discard-content"><div class="discard-icon">↶</div><h2 id="discard-title">放弃未保存的修改？</h2><p>离开后，这次修改不会保留。</p><div class="discard-actions"><button class="secondary-btn" data-action="keep-editing" autofocus>继续编辑</button><button class="danger-btn" data-action="discard-changes">放弃修改</button></div></div></dialog>
  <div id="context-menu" class="context-menu" role="menu" aria-label="课程操作" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <input type="file" id="json-file" accept=".json,application/json" hidden>
  <script src="../shared/course-tools.js"></script>
  <script src="tauri-bridge.js"></script>
  <script src="calendar-ui.js"></script>
  <script src="../shared/grade-book.js"></script>
  <script src="../shared/user-backup.js"></script>
  <script src="../shared/sync-coordinator.js"></script>
  <script src="../shared/sync-adapters/google-sheets.js"></script>
  <script src="../shared/sync-adapters/grade-sync.js"></script>
  <script src="../shared/sync-adapters/foreground-sync.js"></script>
  <script src="../shared/sync-adapters/sheet-mapping.js"></script>
  <script src="../shared/sync-adapters/native-client.js"></script>
  <script src="sheet-mapping-ui.js"></script>
  <script src="grades-ui.js"></script>
  <script src="../shared/calendar-link.js"></script>
  <script src="calendar-integration.js"></script>
  <script src="cloud-calendar-ui.js"></script>
  <script src="app.js"></script>
</body>
</html>
